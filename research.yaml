# The study manifest. Describes the study; contains no results.
id: awa-001
title: "Authority Without Assertion"
subtitle: "Evidence-gated state for agentic systems under contextual pressure"
version: 0.1.0
status: protocol            # protocol → pilot → frozen → running → analysis → released

research_question:
  id: rq-001
  text: >-
    Does evidence-gated persistent state reduce false-authority propagation
    through multi-session agent workflows compared with narrative persistence?

primary_outcome: FAPR       # defined in protocol/scoring.yaml

conditions:
  pilot:                    # PR1: measures the base rate the hypotheses depend on
    - C0-narrative
    - C0p-prompted-provenance
  planned:                  # need the runtime adapters; not implemented in PR1
    - C1-provenance
    - C2-evidence-gated

claims:
  - claim/narrative-persistence-propagates-false-authority   # the premise; the pilot tests it
  - claim/evidence-gating-reduces-false-authority
  - claim/evidence-gating-preserves-constraints
  - claim/adjudication-reduces-recurrence
  - claim/evidence-gating-increases-escalation

systems:
  runtime: [temenos, aletheia, stele, stratum, palimpsest]   # planned, not in PR1
  research_accounting: [bearing]
  publication: [rustpress]                                  # planned, not in PR1

authority:                  # who may author what
  protocol: human
  scoring_rules: human
  raw_results: experiment
  annotations: human        # heuristic pre-annotation is triage only, never scored
  interpretations: non_authoritative_until_checked

models:
  # Identifiers below are configuration, not verified facts: every run records
  # the model the provider reports actually serving (model_resolved), so a
  # mismatch is visible in the record rather than assumed away.
  backends:
    mlx-qwen3-8b:
      adapter: openai-compatible
      provider: mlx
      base_url: "http://127.0.0.1:8080"
      model: "mlx-community/Qwen3-8B-4bit"      # pin the exact revision in preregistration before the pilot
      temperature: 0.0
      max_output_tokens: 2048
      licensing:
        repository_license: NOASSERTION
        output_rights_basis: model_licence
        provider: local (Qwen3 weights, Apache-2.0 per the model card; confirm for the pinned build)
        provider_terms_version: null            # fill when the build is pinned
        redistributable: null                   # unknown until the pinned build's licence is confirmed
    ollama-qwen3-8b:        # convenience only; not part of the experimental contract
      adapter: openai-compatible
      provider: ollama
      base_url: "http://127.0.0.1:11434"
      model: "qwen3:8b"
      temperature: 0.0
      max_output_tokens: 2048
      licensing:
        repository_license: NOASSERTION
        output_rights_basis: model_licence
        provider: local (Qwen3 weights via Ollama)
        provider_terms_version: null
        redistributable: null                   # unknown until the pinned build's licence is confirmed
    openai-gpt-5.6-terra:
      adapter: openai-responses
      provider: openai
      model: "gpt-5.6-terra"
      api_key_env: OPENAI_API_KEY               # read at call time; never written to a record
      temperature: 0.0                          # set to null if the model rejects temperature
      max_output_tokens: 2048
      licensing:
        repository_license: NOASSERTION
        output_rights_basis: provider_terms
        provider: openai
        provider_terms_version: null            # record the date of the terms reviewed before running
        redistributable: null                   # unknown until the terms are reviewed; releases exclude null

licensing:
  code: Apache-2.0
  authored_research_content: CC-BY-4.0
  model_outputs: per-artifact             # LICENSES/LicenseRef-PerArtifact.txt
